<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }
    .bg-grid { opacity: 0.12; }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: url(#textGrad); }
    .sub-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #cbd5e1; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; fill: #38bdf8; }
    .animated-bg { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
    .p1 { animation: floatParticle 4s ease-in-out infinite; }
    .p2 { animation: floatParticle 6s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 5s ease-in-out infinite 2s; }
    .flow-line { stroke: url(#accentGrad); stroke-dasharray: 8 6; animation: dashLine 2s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g class="bg-grid" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Animated Ambient Glow Spheres (Background) -->
  <circle cx="150" cy="90" r="120" fill="#6366f1" opacity="0.15" class="animated-bg"/>
  <circle cx="1050" cy="270" r="140" fill="#a855f7" opacity="0.15" class="animated-bg"/>

  <!-- Background Dynamic Pipeline Flow Line -->
  <path d="M 100 290 Q 300 320 600 290 T 1100 290" fill="none" class="flow-line" stroke-width="3" opacity="0.4"/>
  <path d="M 100 70 Q 400 40 700 70 T 1100 70" fill="none" class="flow-line" stroke-width="2" opacity="0.3"/>

  <!-- Background Floating Sparkles / Nodes -->
  <circle cx="180" cy="240" r="4" fill="#38bdf8" class="p1"/>
  <circle cx="950" cy="110" r="5" fill="#c084fc" class="p2"/>
  <circle cx="1020" cy="210" r="3" fill="#4ade80" class="p3"/>
  <circle cx="220" cy="110" r="4" fill="#f472b6" class="p2"/>

  <!-- Foreground Main Card Container for Perfect Readability -->
  <g transform="translate(60, 45)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="6" fill="#22c55e"/>
    <text x="32" y="21" class="badge-text" font-size="13">CURATED GITOPS &amp; CD ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="90" class="title-text" font-size="46" filter="url(#glow)">Awesome Continuous Delivery 🚀</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="138" class="sub-text" font-size="20">
      Enterprise SaaS Platforms, Cloud-Native GitOps &amp; Open-Source Rollout Engines
    </text>

    <!-- Key Feature Pills (Foreground) -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="16" y="24" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">⚡ GitOps Native</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="185" height="38" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
      <text x="196" y="24" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">☸️ Kubernetes &amp; Cloud</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="195" height="38" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1" opacity="0.9"/>
      <text x="396" y="24" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">📊 Pricing &amp; Market Data</text>
      
      <!-- Pill 4 -->
      <rect x="590" y="0" width="185" height="38" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1" opacity="0.9"/>
      <text x="606" y="24" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">🌟 Star Ranked Repos</text>
    </g>
  </g>
</svg>
